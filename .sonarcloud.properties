# SonarCloud automatic analysis settings.
# Excluded: development-only files that are never part of the released app or server.
#  - backend/scripts/**  : demo-data and maintenance scripts run by hand (use a documented demo password)
#  - android/app/src/debug/**, android/app/src/profile/** : development build configs (allow http to a local backend)
sonar.exclusions=backend/scripts/**,android/app/src/debug/**,android/app/src/profile/**
